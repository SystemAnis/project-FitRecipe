services:
  db:
    image: postgres:15-alpine
    container_name: fit-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: fit_recipes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: fit-api
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://admin:password123@db:5432/fit_recipes
      - FLASK_DEBUG=true
    depends_on:
      - db
    volumes:
      - .:/app


volumes:
  postgres_data: